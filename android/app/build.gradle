plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pcpanel.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.pcpanel.app"
        // Android 4.2.2 (Jelly Bean) desteği
        minSdk 17
        // Runtime permission karmaşası olmadan doğrudan depolama erişimi için 22
        targetSdk 22
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        // Eski Android API'leri ve Java 8 dil özellikleri ile uyumluluk
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // AppCompat, AndroidX veya Jetpack kullanılmıyor; sadece saf Android SDK
}
